[package]
name = "review-monitor"
version = "0.1.0"
edition = "2024"
description = "A focused terminal dashboard for GitHub pull-request reviews"
license = "MIT"

[[bin]]
name = "review-monitor"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.53", features = ["derive"] }
crossterm = "0.29.0"
open = "5.4.0"
ratatui = { version = "0.30.2", features = ["crossterm_0_29", "unstable-rendered-line-info"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[dev-dependencies]
pretty_assertions = "1.4.1"
