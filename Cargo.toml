[package]
name = "kritikon"
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
description = "A focused GitHub pull-request command center for your terminal"
license = "Apache-2.0"
repository = "https://github.com/storozhenko98/kritikon"
homepage = "https://storozhenko98.github.io/kritikon/"
readme = "README.md"
keywords = ["github", "pull-request", "review", "tui", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "kritikon"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.53", features = ["derive"] }
crossterm = "0.29.0"
open = "5.4.0"
ratatui = { version = "0.30.2", features = ["crossterm_0_29", "unstable-rendered-line-info"] }
semver = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "1.1.4"

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
